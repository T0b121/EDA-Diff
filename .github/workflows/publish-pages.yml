# Main-driven GitHub Pages build and deployment workflow.
#
# Every change merged into main is built and published as the current Pages site.
# It uses pinned Ubuntu runners, Node 26, Rust/WASM, and a Node-24 artifact action
# to build and deploy the static Pages artifact without deprecated runtimes.

name: Publish main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install web dependencies
        if: steps.main-check.outputs.eligible == 'true'
        run: npm install

      - name: Set up Rust WebAssembly target
        if: steps.main-check.outputs.eligible == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.main-check.outputs.eligible == 'true'
        run: cargo install wasm-pack --locked

      - name: Build site
        if: steps.main-check.outputs.eligible == 'true'
        run: bash scripts/build-pages.sh

      - name: Configure GitHub Pages
        if: steps.main-check.outputs.eligible == 'true'
        uses: actions/configure-pages@v6

      - name: Archive Pages artifact
        if: steps.main-check.outputs.eligible == 'true'
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Pages artifact
        if: steps.main-check.outputs.eligible == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
