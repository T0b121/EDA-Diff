# Tag-driven GitHub Pages build and deployment workflow.
#
# This workflow publishes only tags whose target commit is contained in main.
# It uses pinned Ubuntu runners, Node 26, Rust/WASM, and a Node-24 artifact action
# to build and deploy the static Pages artifact without deprecated runtimes.

name: Publish tagged main commit

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.main-check.outputs.eligible }}

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main

      - name: Check whether tag belongs to main
        id: main-check
        shell: bash
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Tag commit is contained in main."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not contained in main; publication is skipped."
          fi

      - name: Set up Node.js
        if: steps.main-check.outputs.eligible == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install web dependencies
        if: steps.main-check.outputs.eligible == 'true'
        run: npm install

      - name: Set up Rust WebAssembly target
        if: steps.main-check.outputs.eligible == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.main-check.outputs.eligible == 'true'
        run: cargo install wasm-pack --locked

      - name: Build site
        if: steps.main-check.outputs.eligible == 'true'
        run: bash scripts/build-pages.sh

      - name: Configure GitHub Pages
        if: steps.main-check.outputs.eligible == 'true'
        uses: actions/configure-pages@v6

      - name: Archive Pages artifact
        if: steps.main-check.outputs.eligible == 'true'
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Pages artifact
        if: steps.main-check.outputs.eligible == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: needs.build.outputs.eligible == 'true'
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
