# Rust crate manifest for the shared EDA-Diff core.
#
# This crate owns format-independent EDA logic and can be compiled both natively
# and to WebAssembly. Browser UI and repository-provider code do not belong here.

[package]
name = "eda-diff-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
